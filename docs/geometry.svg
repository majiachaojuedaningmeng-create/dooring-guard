<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="开门杀风险几何关系示意">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#ffffff"/>
  <line x1="30" y1="330" x2="870" y2="330" stroke="#b6c0cc" stroke-width="3"/>

  <!-- 公式 -->
  <rect x="46" y="44" width="308" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="21" fill="#0f172a">TTC = (1 − d) / v</text>
  <text x="200" y="102" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif"
        font-size="12.5" fill="#64748b">d：距离比例（0 = 很远，1 = 贴到车门）</text>

  <!-- 我的车 -->
  <path d="M 74 320 L 74 268 Q 74 252 92 250 L 210 240 Q 250 236 268 244 L 316 262 Q 330 268 330 282 L 330 320 Z"
        fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 168 252 L 246 246 L 258 272 L 160 276 Z" fill="#8fa3b8" opacity="0.75"/>
  <circle cx="122" cy="322" r="17" fill="#475569"/>
  <circle cx="122" cy="322" r="7" fill="#e2e8f0"/>
  <circle cx="286" cy="322" r="17" fill="#475569"/>
  <circle cx="286" cy="322" r="7" fill="#e2e8f0"/>
  <text x="176" y="366" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif"
        font-size="14" fill="#334155">我的车（已靠边停）</text>

  <!-- 风险窗口 -->
  <path d="M 440 200 L 596 330 L 330 330 Z" fill="#dc2626" opacity="0.10"/>
  <path d="M 440 200 L 596 330" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.55"/>
  <text x="432" y="312" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif"
        font-size="13" fill="#b91c1c">风险窗口</text>

  <!-- 打开的车门 -->
  <line x1="330" y1="300" x2="440" y2="200" stroke="#7d8fa6" stroke-width="10" stroke-linecap="round"/>
  <circle cx="330" cy="300" r="5" fill="#475569"/>
  <text x="452" y="176" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">打开的车门</text>

  <!-- 后方来车 -->
  <path d="M 648 318 L 648 282 Q 648 270 664 268 L 700 262 L 726 240 Q 736 234 752 236 L 790 242 Q 806 246 806 262 L 806 318 Z"
        fill="#e7b3b3" stroke="#c98b8b" stroke-width="2"/>
  <path d="M 712 250 L 754 244 L 762 264 L 704 268 Z" fill="#b97474" opacity="0.7"/>
  <circle cx="676" cy="320" r="15" fill="#7a4a4a"/>
  <circle cx="676" cy="320" r="6" fill="#f1f5f9"/>
  <circle cx="786" cy="320" r="15" fill="#7a4a4a"/>
  <circle cx="786" cy="320" r="6" fill="#f1f5f9"/>
  <text x="726" y="366" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif"
        font-size="14" fill="#334155">后方来车</text>

  <!-- 来车速度与方向 -->
  <line x1="866" y1="196" x2="640" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="186" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
        font-size="13" fill="#475569">v</text>

  <!-- 相机视线 -->
  <line x1="300" y1="256" x2="612" y2="286" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"
        marker-end="url(#arrowRed)" opacity="0.65"/>
  <text x="470" y="238" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif"
        font-size="13" fill="#2563eb">相机看的方向</text>

  <!-- 距离标注 -->
  <line x1="440" y1="344" x2="648" y2="344" stroke="#dc2626" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="544" y="338" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
        font-size="13" fill="#b91c1c">d</text>
</svg>
